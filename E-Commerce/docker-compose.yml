services:

  backend:
    build: .
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://host.docker.internal:27017/e-commerce-practise
      PORT: 5000
    networks:
      - ecommerce-network

  frontend:
    build: ./client
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

networks:
  ecommerce-network: