services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-backend

    ports:
      - "8080:8080"

    environment:
      MONGO_URI: mongodb://host.docker.internal:27017/ECOM
      PORT: 8080

    networks:
      - ecommerce-network


  ecommerce:
    build:
      context: ./client/ecommerce
      dockerfile: Dockerfile

    container_name: ecommerce-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - ecommerce-network


  super-admin:
    build:
      context: ./client/super-admin
      dockerfile: Dockerfile

    container_name: ecommerce-super-admin

    ports:
      - "5174:80"

    depends_on:
      - backend

    networks:
      - ecommerce-network


networks:
  ecommerce-network:
    driver: bridge